<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STRIKE ZONE</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:white;font:16px sans-serif;overflow:hidden;touch-action:none}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-content:center;background:linear-gradient(135deg,#172c38,#10151c);z-index:5;padding:24px}h1{color:#f6b94b;margin:0}input,select,button{font:inherit;padding:13px;border-radius:8px;border:1px solid #687b85;background:#263743;color:white;margin:5px}button{background:#b87b25;font-weight:bold}#hud{position:fixed;inset:0;pointer-events:none;display:none}#top{padding:12px;background:#0008;white-space:pre-line}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}#stats{position:absolute;bottom:12px;left:40%;background:#0009;padding:8px}#stick{position:absolute;bottom:35px;left:25px;width:120px;height:120px;border:2px solid #fff8;border-radius:50%;pointer-events:auto;background:#0004}#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:#fffa}#actions{position:absolute;right:12px;bottom:30px;display:grid;grid-template-columns:1fr 1fr;pointer-events:auto}#actions button{background:#17232caa;min-width:65px}#board{position:absolute;right:8px;top:70px;background:#0007;padding:8px;font-size:12px;white-space:pre-line}#msg{color:#ffc66b}#gun{position:absolute;bottom:0;left:54%;width:14%;height:26%;background:linear-gradient(90deg,#161b20,#56616a 45%,#20262a);clip-path:polygon(30% 0,55% 0,65% 30%,90% 100%,0 100%,20% 30%);transform:rotate(-9deg)}@media(pointer:fine){#stick,#actions{display:none}}</style><div id="menu"><h1>STRIKE ZONE</h1><p>ONLINE · WAREHOUSE</p><input id="name" placeholder="닉네임" maxlength="16"><input id="code" placeholder="방 코드 (빈칸: 새 방)"><select id="mode"><option value="solo">개인전</option><option value="team">팀 데스매치</op
